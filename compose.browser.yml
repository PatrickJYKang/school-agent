# Local demonstration of the hosted browser; dedicate a Linux VM for deployment.
name: school-agent-browser
services:
  browser:
    build:
      context: .
      dockerfile: services/browser/Dockerfile
    env_file: .local/browser.env
    init: true
    volumes: ['browser-state:/state']
    networks: [browser]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=256m,mode=1777']
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true', 'seccomp=./config/browser/seccomp.json']
    restart: unless-stopped
    depends_on: [proxy]
  gateway:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    volumes: ['./config/browser/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:3118:8080']
    networks: [browser, control]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=16m,mode=1777']
    mem_limit: 64m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    depends_on: [browser]
  proxy:
    build:
      context: config/browser
      dockerfile: proxy.Dockerfile
    networks: [browser, egress]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=16m,mode=1777']
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    logging:
      driver: none
networks:
  browser:
    internal: true
  control:
  egress:
volumes:
  browser-state:
