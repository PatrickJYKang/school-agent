function chartSvg(rows){const w=520,h=200,l=40,r=20,t=20,b=35,max=Math.max(3,...rows.map(x=>Math.max(x.up,x.down)))*1.08,x=i=>l+(w-l-r)*i/Math.max(rows.length-1,1),y=v=>h-b-(h-t-b)*v/max;let out='<svg class="chart" viewBox="0 0 520 200" role="img" aria-label="Nitrate measurements at upstream and downstream sites"><g font-family="system-ui" font-size="10" fill="#6d7c74">';for(let i=0;i<4;i++){const v=max*i/3;out+='<path d="M'+l+' '+y(v)+'H'+(w-r)+'" stroke="#e0e6dc"/><text x="'+(l-8)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v.toFixed(1)+'</text>';}out+='<text x="40" y="12">Nitrate (mg/L)</text><text x="40" y="195">Sample visit</text></g>';['up','down'].forEach((k,i)=>{out+='<path d="'+rows.map((v,n)=>(n?'L':'M')+x(n)+' '+y(v[k])).join(' ')+'" stroke="'+(i?'#a45b3c':'#47768c')+'" stroke-width="2.5" fill="none"/>';});return out+'</svg><p class="note">Blue: upstream · Terracotta: downstream</p>';}

async function send(text){if(!text||busy||!person().active||s.usage>=s.balance)return;const c=chat(),request={...c,materials:[...c.materials],files:[...c.files]};c.messages.push({role:'user',text});if(c.title==='New chat')c.title=text.slice(0,37);const token=++runId;busy=true;persist();render();$('chat-scroll').scrollTop=$('chat-scroll').scrollHeight;await new Promise(r=>setTimeout(r,650));if(token!==runId)return;const p=s.policies[c.owner],sources=p.canvas?request.materials:[];let answer;
if(/calculate|average|data|chart/i.test(text)){if(!p.analysis)answer={text:'Data analysis is disabled in your school profile. I can still help you think through the comparison.'};else{const dataFile=[...request.files].reverse().find(f=>f.rows),rows=dataFile?.rows||sampleRows,avg=k=>rows.reduce((a,r)=>a+r[k],0)/rows.length;answer={kind:'analysis',text:'I calculated the means from '+rows.length+' paired samples in '+(dataFile?.name||'the sample dataset')+'. A measured difference supports comparing the sites; it does not establish a cause.',up:avg('up'),down:avg('down'),rows,sources,tools:['Read '+(dataFile?.name||'the sample dataset'),'Calculate means and paired differences']};}}

else if(request.helper==='teaching'||c.owner==='educator')answer={text:'Try asking: “What evidence supports the comparison, and what further measurement would identify a cause?”\n\nUse the selected rubric to check calculations, the distinction between evidence and explanation, and discussion of uncertainty. Review the wording before using it with students.',sources,tools:sources.length?['Read the selected rubric']:[]};
else if(/write.*report|finish.*assignment/i.test(text))answer={text:'Let’s develop your conclusion from the evidence. Start with the pattern you observed, then explain one limitation. What claim can you support without assuming its cause?',sources};
else if(request.style==='feedback'||/reasoning|feedback|draft/i.test(text))answer={text:'Check whether your explanation separates a measured pattern from a proposed cause. Name the evidence for the pattern, then add an alternative explanation and the measurement that could test it.\n\nShare your wording if you want more specific feedback.',sources,tools:sources.length?['Read selected course context']:[]};

if(a==='helpers'){if(s.role==='admin'){toast('Choose a chat preview to use a helper.');return;}helpers();}if(a==='pick-helper'){chat().helper=b.dataset.id;s.screen='chat';persist();close();render();}if(a==='models')models();if(a==='pick-model'){if(b.dataset.model==='Reasoning'&&!policy().reasoning)return;chat().model=b.dataset.model;persist();close();render();}if(a==='context')context();if(a==='use-context'){chat().course=pendingMaterials.length?pendingCourse:'';chat().materials=[...pendingMaterials];persist();close();render();}if(a==='clear-context'){chat().course='';chat().materials=[];persist();close();render();}if(a==='source')source(b.dataset.source,Number(b.dataset.index));if(a==='connections')connections();if(a==='microsoft')microsoft();
if(a==='attach')modal('Add material','<p>Choose selected material for this conversation.</p><button class="helper-choice" data-action="context" '+(!policy().canvas?'disabled':'')+'><strong>From Canvas</strong><small>Assignment, rubric, or selected course content</small></button><button class="helper-choice" data-action="microsoft" '+(!policy().microsoft?'disabled':'')+'><strong>From OneDrive / SharePoint</strong><small>Use the existing Microsoft 365 file-picker pattern</small></button><button class="helper-choice" data-action="upload"><strong>Upload a file</strong><small>Plain text, Markdown, or CSV in this demo</small></button>');
if(a==='upload'){close();$('file-input').click();}if(a==='attach-microsoft'){if($('pick-word').checked&&!chat().files.some(f=>f.name==='lab-notes.docx'))chat().files.push({name:'lab-notes.docx',text:'Lab notes: measured nitrate was higher downstream. Check sampling conditions before attributing the cause.'});if($('pick-reading').checked&&!chat().files.some(f=>f.name==='sampling-methods.pdf'))chat().files.push({name:'sampling-methods.pdf',text:'Methods note: use paired samples, document rainfall and collection time, and repeat the measurements.'});persist();close();render();}if(a==='file')fileInfo(Number(b.dataset.index));if(a==='tools')tools();if(a==='privacy')privacy();if(a==='helper-info'){const he=helper();modal(he.name,'<p>'+esc(he.instructions)+'</p><span class="tag">'+esc(he.author)+' · '+esc(he.audience)+'</span><p class="note" style="margin-top:16px">Guidance shapes responses. Account and tool restrictions are separate platform controls.</p>');}
if(a==='stop'){runId++;busy=false;chat().messages.push({role:'assistant',text:'Stopped. Your chat and attached material are still available.'});persist();render();}if(a==='export')download('# '+chat().title+'\n\n'+chat().messages.map(m=>'## '+(m.role==='user'?'You':m.agentName||helper().name)+'\n\n'+asText(m)).join('\n\n'),'conversation.md');if(a==='export-message')download(asText(chat().messages[Number(b.dataset.index)]),'note.md');
if(a==='teaching'){s.screen='teaching';render();$('sidebar').classList.remove('mobile-open');}if(a==='admin'){s.screen='admin';render();}if(a==='create-helper')createHelper();if(a==='publish-helper'){if(!policy().create)return;const name=$('helper-name').value.trim(),instructions=$('helper-instructions').value.trim();if(!name||!instructions){toast('Add a name and guidance for the helper.');return;}s.helpers.push({id:'helper-'+Date.now(),name,description:instructions.slice(0,120),instructions,audience:$('helper-audience').value,author:'Ms. Chen'});persist();close();renderTeaching();toast('Demo helper published to the selected group.');}if(a==='inspect-helper'){const he=s.helpers.find(h=>h.id===b.dataset.id);modal(he.name,'<span class="tag">'+esc(he.audience)+'</span><p style="margin-top:16px">'+esc(he.instructions)+'</p><p class="note">Published by '+esc(he.author)+'. Tool access stays within the school profile and the person’s own permissions.</p>');}
if(a==='save-policy'){persist();toast('Demo settings saved in this browser.');}if(a==='reset')modal('Reset this local demo?','<p>Clear prototype chats, helpers, and settings created in this browser. No LibreChat account or external system is affected.</p>','<button class="button" data-action="close">Cancel</button><button class="button primary" data-action="confirm-reset">Reset demo</button>');if(a==='confirm-reset'){runId++;busy=false;s=structuredClone(defaults);s.chats.forEach(c=>c.messages.forEach(m=>freezeSources(c,m)));persist();close();render();}
});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='guidance'){chat().style=el.value;persist();}if(el.id==='canvas-course'){pendingCourse=el.value;pendingMaterials=[];renderContext();}if(el.dataset.material){pendingMaterials=el.checked?[...new Set([...pendingMaterials,el.dataset.material])]:pendingMaterials.filter(x=>x!==el.dataset.material);}if(el.id==='school-profile'){s.profile=el.value;renderAdmin();}if(el.dataset.policy){s.policies[s.profile][el.dataset.policy]=el.checked;persist();}if(el.id==='retention'){s.retention=el.value;persist();}if(el.id==='balance'){s.balance=Math.max(100,Math.min(100000,Number(el.value)||1000));persist();}if(el.dataset.access!==undefined){s.people[Number(el.dataset.access)].active=el.checked;persist();}});
$('chat-form').addEventListener('submit',e=>{e.preventDefault();const text=$('prompt').value.trim();$('prompt').value='';send(text);});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('chat-form').requestSubmit();}});
$('file-input').addEventListener('change',async function(){const f=this.files[0];if(!f)return;if(f.size>250000){toast('Use a text or CSV file below 250 KB in this prototype.');this.value='';return;}const text=await f.text(),entry={name:f.name,text};if(f.name.toLowerCase().endsWith('.csv')){const rows=text.trim().split(/\r?\n/).slice(1).map(line=>line.split(',')).filter(v=>v.length>=3).map(v=>({visit:v[0],up:Number(v[1]),down:Number(v[2])}));if(rows.length&&rows.length<=100&&rows.every(r=>Number.isFinite(r.up)&&Number.isFinite(r.down)&&r.up>=0&&r.down>=0))entry.rows=rows;}chat().files.push(entry);persist();render();this.value='';toast('File added as local demo context.');});
new ResizeObserver(()=>document.documentElement.style.setProperty('--demo-height',document.querySelector('.demo').getBoundingClientRect().height+'px')).observe(document.querySelector('.demo'));s.chats.forEach(c=>c.messages.forEach(m=>freezeSources(c,m)));render();
})();
</script></body></html>
